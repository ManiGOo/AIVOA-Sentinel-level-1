services:
  temporal:
    image: temporalio/admin-tools:latest
    ports:
      - "7233:7233"
      - "8233:8233"
    command: temporal server start-dev --ip 0.0.0.0

  app:
    build: .
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    ports:
      - "5000:5000"
    command: uvicorn main:app --host 0.0.0.0 --port 5000
    depends_on:
      - temporal

  worker:
    build: .
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    command: python worker.py
    restart: unless-stopped
    depends_on:
      - temporal
