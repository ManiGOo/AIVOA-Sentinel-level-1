services:
  temporal:
    image: temporalio/admin-tools:latest
    ports:
      - "7233:7233"
      - "8233:8233"
    command: temporal server start-dev --ip 0.0.0.0
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: .
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    ports:
      - "5000:5000"
    command: uvicorn main:app --host 0.0.0.0 --port 5000
    depends_on:
      temporal:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    command: python worker.py
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy

  enricher:
    build:
      context: .
      dockerfile: Dockerfile.enricher
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python enricher_worker.py
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
