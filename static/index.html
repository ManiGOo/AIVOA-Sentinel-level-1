<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDR Project Sentinel Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#9333EA',
                        dark: '#111827',
                        card: '#1F2937',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        
        .glass-panel {
            background: rgba(31, 41, 55, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .signal-card {
            transition: all 0.3s ease;
        }
        .signal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(147, 51, 234, 0.3);
            border-color: rgba(147, 51, 234, 0.5);
        }
    </style>
</head>
<body class="p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                    AIVOA Sentinel
                </h1>
                <p class="text-slate-400 mt-2">Level 1 CDSCO Scraper Dashboard</p>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="btnTriggerScraper" onclick="triggerScraper()" class="px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg font-semibold shadow-lg shadow-purple-500/30 hover:shadow-purple-500/50 transition-all flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Activate Scraper
                </button>
                <button id="btnBackfill" onclick="triggerBackfill()" class="px-6 py-3 bg-gradient-to-r from-slate-700 to-slate-600 rounded-lg font-semibold shadow-lg shadow-black/30 hover:shadow-black/50 transition-all flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v5h5m10 0v-5h-5m0 0H9m11 11v-5h-5m-10 0v5h5m0-5H9" />
                    </svg>
                    Full Backfill
                </button>
            </div>
        </header>

        <!-- Stats / Notification Area -->
        <div id="notificationArea" class="hidden mb-8 p-4 bg-green-900/50 border border-green-500/30 rounded-lg text-green-300 flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="notificationText">Scraper triggered successfully. It runs in the background.</span>
        </div>

        <!-- Scraper Queue Status -->
        <div id="queueArea" class="hidden mb-8 glass-panel p-5 border-l-4 border-l-blue-500">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <span id="queueStatusDot" class="w-3 h-3 rounded-full bg-blue-400 animate-pulse-slow"></span>
                    <h3 class="font-semibold">Scraper Queue</h3>
                </div>
                <span id="queueEta" class="text-sm text-blue-300 font-mono"></span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-3 mb-2 overflow-hidden">
                <div id="queueProgressBar" class="h-full bg-gradient-to-r from-blue-500 to-purple-500 transition-all duration-700" style="width:0%"></div>
            </div>
            <div class="flex justify-between text-xs text-slate-400">
                <span id="queueCounts">0 / 0 records</span>
                <span id="queueEvent">-</span>
                <span id="queueElapsed">elapsed -</span>
            </div>
            <div id="queueWarnings" class="hidden mt-3 space-y-1"></div>
        </div>

        <!-- Dashboard Content -->
        <div class="glass-panel p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold">High Priority Signals</h2>
                <div class="flex items-center gap-3">
                    <select id="yearFilter" onchange="fetchSignals()" class="px-3 py-2 bg-slate-800/70 border border-slate-700 rounded-lg text-sm text-slate-300 focus:outline-none focus:border-blue-500">
                        <option value="">All Years</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                    </select>
                    <button onclick="fetchSignals()" class="text-sm text-slate-400 hover:text-white flex items-center gap-1 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        Refresh
                    </button>
                </div>
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap items-center gap-3 mb-6 p-4 bg-slate-800/40 rounded-lg border border-slate-700/50">
                <select id="filterEventType" onchange="resetAndRender()" class="px-3 py-2 bg-slate-800/70 border border-slate-700 rounded-lg text-sm text-slate-300 focus:outline-none focus:border-blue-500">
                    <option value="">All Types</option>
                    <option value="NSQ_DRUG">NSQ</option>
                    <option value="SPURIOUS_DRUG">Spurious</option>
                </select>
                <select id="filterPaper" onchange="resetAndRender()" class="px-3 py-2 bg-slate-800/70 border border-slate-700 rounded-lg text-sm text-slate-300 focus:outline-none focus:border-blue-500">
                    <option value="">All (paper + non-paper)</option>
                    <option value="paper">Paper-based only</option>
                    <option value="nonpaper">Non-paper only</option>
                </select>
                <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer"><input type="checkbox" id="filterRule96" onchange="resetAndRender()" class="accent-red-500 w-4 h-4"><span title="2026 mandate — QR code/serialization on APIs" class="px-2 py-0.5 text-[10px] rounded border bg-red-900/50 text-red-300 border-red-700/50">Rule 96</span></label>
                <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer"><input type="checkbox" id="filterSubRule7" onchange="resetAndRender()" class="accent-orange-500 w-4 h-4"><span title="2026 mandate — excipient controls for FDFs" class="px-2 py-0.5 text-[10px] rounded border bg-orange-900/50 text-orange-300 border-orange-700/50">Sub-Rule 7</span></label>
                <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer"><input type="checkbox" id="filterH2" onchange="resetAndRender()" class="accent-purple-500 w-4 h-4"><span title="2026 mandate — antimicrobial track-and-trace" class="px-2 py-0.5 text-[10px] rounded border bg-purple-900/50 text-purple-300 border-purple-700/50">Schedule H2</span></label>
                <label class="flex items-center gap-2 text-sm text-slate-300">
                    Min Score
                    <input type="number" id="filterMinScore" oninput="resetAndRender()" value="0" min="0" max="100" class="w-20 px-2 py-1.5 bg-slate-800/70 border border-slate-700 rounded-lg text-sm text-slate-300 focus:outline-none focus:border-blue-500">
                </label>
                <input type="search" id="searchInput" oninput="debouncedSearch()" placeholder="Search drug, manufacturer, address, batch no, reason..." class="flex-1 min-w-[220px] px-3 py-2 bg-slate-800/70 border border-slate-700 rounded-lg text-sm text-slate-300 focus:outline-none focus:border-blue-500">
                <span id="filterCount" class="text-xs text-slate-400 ml-auto"></span>
            </div>

            <div id="yearRangeBanner" class="hidden mb-4 px-4 py-2 rounded-lg border border-sky-700/50 bg-sky-900/30 text-sky-300 text-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span id="yearRangeText"></span>
            </div>

            <div id="signalsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Data will be populated here -->
                <div class="col-span-full text-center py-10 text-slate-500">
                    Loading signals...
                </div>
            </div>

            <div class="flex items-center justify-between mt-6">
                <span id="pageInfo" class="text-sm text-slate-400"></span>
                <div class="flex items-center gap-2">
                    <button id="prevPageBtn" onclick="prevPage()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 transition-colors rounded text-sm font-semibold disabled:opacity-40 disabled:cursor-not-allowed">‹ Prev</button>
                    <button id="nextPageBtn" onclick="nextPage()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 transition-colors rounded text-sm font-semibold disabled:opacity-40 disabled:cursor-not-allowed">Next ›</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allSignals = [];
        let totalCount = 0;
        let totalPages = 1;
        let paperCount = 0;
        let currentPage = 1;
        const PAGE_SIZE = 30;
        let searchTimer = null;
        let VIEW_ONLY = false;

        function buildQueryUrl() {
            const params = new URLSearchParams();
            const year = document.getElementById('yearFilter').value;
            const q = document.getElementById('searchInput').value.trim();
            // Search is year-agnostic: it scans all years, so drop the year filter while a query is active.
            if (year && !q) params.set('year', year);
            params.set('page', currentPage);
            params.set('page_size', PAGE_SIZE);
            const ms = parseInt(document.getElementById('filterMinScore').value || '0', 10);
            if (ms > 0) params.set('min_score', ms);
            const et = document.getElementById('filterEventType').value;
            if (et) params.set('event_type', et);
            const paper = document.getElementById('filterPaper').value;
            if (paper) params.set('is_paper', paper === 'paper' ? 'true' : 'false');
            if (document.getElementById('filterRule96').checked) params.set('rule_96', 'true');
            if (document.getElementById('filterSubRule7').checked) params.set('sub_rule_7', 'true');
            if (document.getElementById('filterH2').checked) params.set('schedule_h2', 'true');
            if (q) params.set('q', q);
            return '/api/v1/signals/high-priority?' + params.toString();
        }

        function resetAndRender() { currentPage = 1; fetchSignals(); }

        function debouncedSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(resetAndRender, 400);
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                fetchSignals();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                fetchSignals();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        const PLACEHOLDER_MFR = /^(under investigation|not known|unknown|not available|nil|n\/a|na|not disclosed)$/i;

        function splitManufacturer(m) {
            const s = String(m || '').trim();
            if (!s) return { name: 'Unknown Manufacturer', address: '' };
            if (PLACEHOLDER_MFR.test(s)) return { name: 'Manufacturer under investigation', address: 'Identity withheld by regulator' };
            const i = s.indexOf(',');
            if (i > 0) return { name: s.slice(0, i).trim(), address: s.slice(i + 1).trim() };
            return { name: s, address: '' };
        }

        function getClassificationTags(a) {
            const tags = [];
            if (a?.is_paper_failure) tags.push({ label: 'Paper QMS', cls: 'bg-yellow-900/50 text-yellow-300 border-yellow-700/50' });
            if (a?.violates_rule_96) tags.push({ label: 'Rule 96', cls: 'bg-red-900/50 text-red-300 border-red-700/50' });
            if (a?.violates_sub_rule_7) tags.push({ label: 'Sub-Rule 7', cls: 'bg-orange-900/50 text-orange-300 border-orange-700/50' });
            if (a?.violates_schedule_h2) tags.push({ label: 'Schedule H2', cls: 'bg-purple-900/50 text-purple-300 border-purple-700/50' });
            return tags;
        }

        function scoreBreakdownHtml(signal) {
            const sb = signal.score_breakdown || {};
            const flagLabels = { violates_rule_96: 'Rule 96', violates_sub_rule_7: 'Sub-Rule 7', violates_schedule_h2: 'Schedule H2' };
            const mandateTxt = (sb.mandate_flags || []).map(f => flagLabels[f] || f).join(', ');
            const fmt = (w) => (w == null ? '—' : '×' + Number(w).toFixed(1));
            return `
                <div class="pointer-events-none absolute right-0 top-full mt-2 z-50 hidden group-hover:block w-64 p-3 bg-slate-900 border border-slate-700 rounded-lg shadow-xl">
                    <p class="text-xs text-slate-400 uppercase tracking-wider mb-2">Score Breakdown</p>
                    <div class="space-y-1 text-xs text-slate-300">
                        <div class="flex justify-between gap-2"><span>Base (${signal.event_type})</span><span class="text-white">+${sb.base ?? 0}</span></div>
                        <div class="flex justify-between gap-2"><span>Paper QMS</span><span class="text-white">+${sb.paper_bonus ?? 0}</span></div>
                        <div class="flex justify-between gap-2"><span>2026 Mandate${mandateTxt ? ' · ' + mandateTxt : ''}</span><span class="text-white">+${sb.mandate_bonus ?? 0}</span></div>
                        <div class="flex justify-between gap-2"><span>Recency</span><span class="text-white">${fmt(sb.recency_weight)}</span></div>
                        <div class="flex justify-between gap-2"><span>Repeat offender (${sb.prior_events ?? 0} prior)</span><span class="text-white">+${sb.repeat_offender_bonus ?? 0}</span></div>
                        <div class="border-t border-slate-700 mt-2 pt-1 flex justify-between gap-2 font-bold text-white"><span>Total</span><span>${signal.score}</span></div>
                    </div>
                </div>
            `;
        }

        function renderCards() {
            const container = document.getElementById('signalsContainer');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            const pageInfo = document.getElementById('pageInfo');

            document.getElementById('filterCount').textContent =
                `${totalCount} matching · ${paperCount} paper-based`;

            if (totalCount === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-10 text-slate-500">
                        No signals match the current filters.
                    </div>
                `;
                pageInfo.textContent = '0 results';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }

            const start = (currentPage - 1) * PAGE_SIZE;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage >= totalPages;
            pageInfo.textContent = `Page ${currentPage} / ${totalPages} · showing ${start + 1}–${start + allSignals.length} of ${totalCount}`;

            container.innerHTML = '';
            allSignals.forEach(signal => {
                const drugName = signal.raw_details?.drug_name || 'Unknown Drug';
                const reason = signal.raw_details?.reason || 'No reason provided';
                const rootCause = signal.llm_analysis?.root_cause_summary || 'Analysis pending';
                const { name: company, address } = splitManufacturer(signal.raw_details?.manufacturer || 'Unknown Manufacturer');
                const tags = getClassificationTags(signal.llm_analysis);

                let scoreColor = 'text-green-400';
                if (signal.score >= 85) scoreColor = 'text-red-400';
                else if (signal.score >= 65) scoreColor = 'text-yellow-400';

                const card = document.createElement('div');
                card.className = 'glass-panel p-5 signal-card border border-slate-700 flex flex-col justify-between h-full';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="px-3 py-1 bg-blue-900/50 text-blue-300 text-xs rounded-full font-medium border border-blue-700/50">
                                ${signal.event_type}
                            </span>
                            <div class="relative flex flex-col items-end group cursor-help">
                                <span class="text-3xl font-bold ${scoreColor}">${signal.score}</span>
                                <span class="text-xs text-slate-500 uppercase tracking-wide">Lead Score</span>
                                ${scoreBreakdownHtml(signal)}
                            </div>
                        </div>

                        <h3 class="font-bold text-xl mb-1 text-white">${esc(company)}</h3>
                        ${address ? `<p class="text-xs text-slate-500 mb-3 leading-relaxed">${esc(address)}</p>` : ''}
                        <p class="text-slate-400 text-sm mb-4">${esc(drugName)}</p>

                        <div class="mb-4">
                            <p class="text-xs text-slate-500 uppercase tracking-wider mb-1">Issue</p>
                            <p class="text-sm text-slate-300 line-clamp-2" title="${esc(reason)}">${esc(reason)}</p>
                            <p class="text-[10px] text-slate-500 mt-2">Reported: ${esc(signal.event_date || 'n/a')}</p>
                        </div>

                        <div class="mb-5 p-3 bg-slate-800/50 rounded-lg border border-slate-700">
                            <p class="text-xs text-slate-500 uppercase tracking-wider mb-1">AI Root Cause Summary</p>
                            <p class="text-sm text-slate-300 line-clamp-2">${esc(rootCause)}</p>
                            ${tags.length ? `
                            <div class="mt-2 flex gap-2 flex-wrap">
                                ${tags.map(t => `<span class="px-2 py-0.5 text-[10px] rounded border ${t.cls}">${t.label}</span>`).join('')}
                            </div>` : ''}
                        </div>
                    </div>

                    ${VIEW_ONLY ? '' : `
                    <div class="mt-auto space-y-2">
                        <button onclick="approveCampaign('${signal.event_id}')" class="w-full py-2 bg-slate-700 hover:bg-green-600 transition-colors rounded text-sm font-semibold flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                            </svg>
                            Approve & Dispatch
                        </button>
                        <button id="enrichBtn-${signal.event_id}" onclick="enrichCard('${signal.event_id}')" class="w-full py-2 bg-indigo-800 hover:bg-indigo-600 transition-colors rounded text-sm font-semibold flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
                            </svg>
                            Check FDA + EudraGMDP
                        </button>
                        <div id="enrichResult-${signal.event_id}" class="hidden"></div>
                    </div>`}
                `;
                container.appendChild(card);
            });
        }

        async function fetchSignals() {
            try {
                const response = await fetch(buildQueryUrl());
                const data = await response.json();

                const items = data.items || [];
                allSignals = items;
                totalCount = data.total || 0;
                totalPages = Math.max(data.pages || 1, 1);
                paperCount = data.paper_count || 0;
                currentPage = Math.min(Math.max(data.page || 1, 1), totalPages);

                const years = [...new Set(items.map(s => (s.event_date || '').slice(0, 4)).filter(Boolean))].sort();
                const banner = document.getElementById('yearRangeBanner');
                const bannerText = document.getElementById('yearRangeText');
                if (years.length > 1) {
                    bannerText.textContent = `Combined data from ${years[0]} to ${years[years.length - 1]} (${years.length} years, across ${totalCount} signals)`;
                    banner.classList.remove('hidden');
                } else {
                    banner.classList.add('hidden');
                }

                renderCards();
            } catch (error) {
                console.error("Failed to fetch signals:", error);
                document.getElementById('signalsContainer').innerHTML = `
                    <div class="col-span-full text-center py-10 text-red-400">
                        Failed to load data. Is the backend running?
                    </div>
                `;
            }
        }

        async function triggerBackfill() {
            if (VIEW_ONLY) { alert('Scraper execution is disabled in this view-only deployment.'); return; }
            if (!confirm('Start FULL historical backfill (2019-2026, ~8 hours of LLM processing)?')) {
                return;
            }
            const btn = document.getElementById('btnBackfill');
            btn.innerHTML = 'Backfilling...';
            btn.disabled = true;
            try {
                const res = await fetch('/api/v1/scraper/trigger', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full: true })
                });
                const data = await res.json();
                alert(data.message || 'Backfill workflow started');
            } catch (e) {
                alert("Failed to trigger backfill");
            } finally {
                btn.innerHTML = 'Full Backfill';
                btn.disabled = false;
            }
        }

        async function triggerScraper() {
            if (VIEW_ONLY) { alert('Scraper execution is disabled in this view-only deployment.'); return; }
            const btn = document.getElementById('btnTriggerScraper');
            const notif = document.getElementById('notificationArea');
            
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Scraping...
            `;
            btn.disabled = true;

            try {
                const res = await fetch('/api/v1/scraper/trigger', { method: 'POST' });
                const data = await res.json();
                
                notif.classList.remove('hidden');
                setTimeout(() => notif.classList.add('hidden'), 5000);
            } catch (e) {
                alert("Failed to trigger scraper");
            } finally {
                btn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Activate Scraper
                `;
                btn.disabled = false;
            }
        }

        async function approveCampaign(eventId) {
            if (VIEW_ONLY) { alert('Dispatch is disabled in this view-only deployment.'); return; }
            try {
                const res = await fetch(`/api/v1/campaigns/${eventId}/approve`, { method: 'POST' });
                const data = await res.json();
                alert(data.message);
            } catch (e) {
                alert("Approval failed!");
            }
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function enrichCard(eventId) {
            if (VIEW_ONLY) { alert('Enrichment is disabled in this view-only deployment.'); return; }
            const btn = document.getElementById('enrichBtn-' + eventId);
            const box = document.getElementById('enrichResult-' + eventId);
            if (!btn || btn.disabled) return;
            btn.disabled = true;
            const original = btn.innerHTML;
            btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.5m15-.5V4m0 0h-5m5 0l-4 4M4 20v-5h.5m15 .5V20m0 0h-5m5 0l-4-4" transform="rotate(45 12 12)"/></svg> Checking FDA + EudraGMDP…';
            box.classList.remove('hidden');
            box.innerHTML = '<p class="text-xs text-indigo-300 animate-pulse">Enrichment running — this takes ~30-60s…</p>';
            try {
                const res = await fetch('/api/v1/enrichment/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event_id: eventId, source: 'all' })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Failed to start enrichment');
                const workflowIds = data.workflow_ids || [];
                if (!workflowIds.length) throw new Error('No enrichment workflows started');

                const summaries = {};
                const deadline = Date.now() + 6 * 60 * 1000;
                let pending = workflowIds.slice();
                while (pending.length && Date.now() < deadline) {
                    await sleep(5000);
                    const stillPending = [];
                    for (const wid of pending) {
                        try {
                            const s = await (await fetch('/api/v1/enrichment/status/' + wid)).json();
                            summaries[wid] = s;
                            if (s.state === 'RUNNING') stillPending.push(wid);
                        } catch (e) {
                            stillPending.push(wid);
                        }
                    }
                    pending = stillPending;
                }
                if (pending.length) {
                    box.innerHTML = '<p class="text-xs text-yellow-300">Enrichment still running in the background — refresh this card later.</p>';
                } else {
                    renderEnrichResult(box, summaries);
                }
            } catch (e) {
                box.innerHTML = '<p class="text-xs text-red-400">Enrichment failed: ' + esc(e.message) + '</p>';
                btn.disabled = false;
                btn.innerHTML = original;
            }
        }

        function renderEnrichResult(box, summaries) {
            const agg = { findings: 0, inserted: 0, paper: 0, errors: [] };
            Object.values(summaries).forEach(s => {
                const sm = s.summary || {};
                agg.findings += sm.findings || 0;
                agg.inserted += sm.inserted || 0;
                agg.paper += sm.paper_qms_findings || 0;
                (sm.errors || []).forEach(e => agg.errors.push(e));
            });
            let html = '';
            if (agg.findings > 0) {
                html = `<div class="p-2 rounded border border-green-700/50 bg-green-900/20 text-xs">
                    <p class="text-green-300 font-semibold">✓ ${agg.findings} external finding(s)${agg.inserted ? ` · ${agg.inserted} saved` : ''}</p>
                    ${agg.paper > 0 ? `<p class="mt-1 text-yellow-300 font-semibold">⚠ ${agg.paper} Paper-QMS flagged</p>` : ''}
                </div>`;
            } else if (agg.errors.length) {
                html = `<div class="p-2 rounded border border-red-700/50 bg-red-900/20 text-xs text-red-300">
                    Enrichment errors: ${esc(agg.errors.join('; '))}
                </div>`;
            } else {
                html = `<div class="p-2 rounded border border-slate-700 bg-slate-800/50 text-xs text-slate-400">
                    No FDA / EudraGMDP findings for this manufacturer.
                </div>`;
            }
            box.innerHTML = html;
        }

        function formatDuration(seconds) {
            if (!seconds && seconds !== 0) return '...';
            seconds = Math.max(0, Math.round(seconds));
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return h > 0 ? `${h}h ${m}m` : `${m}m ${seconds % 60}s`;
        }

        async function fetchQueueStatus() {
            const area = document.getElementById('queueArea');
            try {
                const res = await fetch('/api/v1/scraper/status');
                const s = await res.json();

                if (s.status === 'idle' || s.status === 'error' || s.status === 'disabled') {
                    area.classList.add('hidden');
                    return;
                }
                area.classList.remove('hidden');

                const pct = s.percent || 0;
                document.getElementById('queueProgressBar').style.width = pct + '%';
                document.getElementById('queueCounts').textContent = `${s.processed} / ${s.total} records`;
                document.getElementById('queueEvent').textContent = s.event_type || 'done';
                document.getElementById('queueElapsed').textContent = 'elapsed ' + formatDuration(s.elapsed_seconds);

                const etaEl = document.getElementById('queueEta');
                const dot = document.getElementById('queueStatusDot');
                if (s.status === 'finished') {
                    etaEl.textContent = 'DONE';
                    dot.className = 'w-3 h-3 rounded-full bg-green-400';
                } else if (s.eta_seconds != null) {
                    etaEl.textContent = 'ETA ~' + formatDuration(s.eta_seconds);
                } else {
                    etaEl.textContent = 'estimating...';
                }

                const warnEl = document.getElementById('queueWarnings');
                const warnings = s.warnings || [];
                if (warnings.length) {
                    warnEl.classList.remove('hidden');
                    warnEl.innerHTML = warnings.map(w =>
                        '<div class="text-xs text-amber-400 font-mono">⚠ ' + w + '</div>'
                    ).join('');
                } else {
                    warnEl.classList.add('hidden');
                }
            } catch (e) {
                area.classList.add('hidden');
            }
        }

        async function fetchViewOnlyMode() {
            try {
                const res = await fetch('/api/v1/config');
                const cfg = await res.json();
                VIEW_ONLY = !!cfg.view_only;
                if (VIEW_ONLY) {
                    document.getElementById('btnTriggerScraper').classList.add('hidden');
                    document.getElementById('btnBackfill').classList.add('hidden');
                    fetchSignals();
                }
            } catch (e) {
                VIEW_ONLY = false;
            }
        }

        // Initial load
        fetchViewOnlyMode();
        fetchSignals();
        fetchQueueStatus();
        setInterval(fetchQueueStatus, 5000);
    </script>
</body>
</html>
